<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bgBlue)"/>

  <!-- clouds / stars -->
  <circle cx="200" cy="40" r="10" fill="#ffffff" opacity="0.8"/>
  <circle cx="185" cy="35" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="40" cy="55" r="3" fill="#ffffff"/>
  <circle cx="25" cy="80" r="2" fill="#ffffff"/>
  <circle cx="210" cy="200" r="2" fill="#ffffff"/>

  <!-- ground -->
  <path d="M0 210 Q120 195 240 210 L240 240 L0 240 Z" fill="#86efac"/>

  <!-- legs -->
  <rect x="100" y="168" width="16" height="40" rx="4" fill="#0f172a" stroke="#0f172a" stroke-width="3"/>
  <rect x="124" y="168" width="16" height="40" rx="4" fill="#0f172a" stroke="#0f172a" stroke-width="3"/>
  <!-- shoes -->
  <ellipse cx="108" cy="212" rx="12" ry="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <ellipse cx="132" cy="212" rx="12" ry="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

  <!-- body -->
  <path d="M88 118 Q120 108 152 118 L148 180 Q120 188 92 180 Z" fill="#2563eb" stroke="#0f172a" stroke-width="3"/>
  <!-- number on shirt -->
  <text x="120" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#ffffff">7</text>

  <!-- arms -->
  <rect x="72" y="120" width="18" height="52" rx="9" fill="#fcd5b4" stroke="#0f172a" stroke-width="3"/>
  <rect x="150" y="120" width="18" height="52" rx="9" fill="#fcd5b4" stroke="#0f172a" stroke-width="3"/>

  <!-- head -->
  <circle cx="120" cy="86" r="30" fill="#fcd5b4" stroke="#0f172a" stroke-width="3"/>

  <!-- cap (backwards) -->
  <path d="M90 78 Q120 52 150 78 L150 90 L90 90 Z" fill="#1d4ed8" stroke="#0f172a" stroke-width="3"/>
  <path d="M86 90 L154 90 L154 96 L86 96 Z" fill="#1d4ed8" stroke="#0f172a" stroke-width="3"/>
  <!-- cap button -->
  <circle cx="120" cy="64" r="3" fill="#0f172a"/>

  <!-- face -->
  <circle cx="110" cy="92" r="2.5" fill="#0f172a"/>
  <circle cx="130" cy="92" r="2.5" fill="#0f172a"/>
  <path d="M112 104 Q120 110 128 104" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="104" cy="100" r="3" fill="#fca5a5" opacity="0.8"/>
  <circle cx="136" cy="100" r="3" fill="#fca5a5" opacity="0.8"/>
</svg>
