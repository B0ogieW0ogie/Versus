networks:
  versus:

volumes:
  pgdata:
  letsencrypt:
  certbot-www:

services:

  nginx:
    container_name: versus_nginx
    build:
      context: ./.docker/nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./:/var/www/app
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    environment:
      - DOMAIN=${APP_DOMAIN:-versus-battle.com}
    depends_on:
      php:
        condition: service_healthy
    networks:
      - versus

  certbot:
    image: certbot/certbot:latest
    container_name: versus_certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

  php:
    container_name: versus_php
    build:
      context: ./.docker/php
    restart: unless-stopped
    volumes:
      - ./:/var/www/app
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - versus
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 5s
      timeout: 3s
      retries: 10

  workspace:
    container_name: versus_ws
    build:
      context: ./.docker/workspace
    volumes:
      - ./:/var/www/app
    environment:
      - COMPOSER_MEMORY_LIMIT=-1
    tty: true
    stdin_open: true
    networks:
      - versus

  scheduler:
    container_name: versus_scheduler
    build:
      context: ./.docker/php
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - versus

  queue-worker:
    container_name: versus_queue
    # Same runtime as php-fpm — reuse its image instead of building a third copy.
    image: versus-php:latest
    build:
      context: ./.docker/php
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - versus

  postgres:
    container_name: versus_pg
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-versus}
      POSTGRES_USER: ${DB_USERNAME:-versus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-versus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - versus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-versus} -d ${DB_DATABASE:-versus}"]
      interval: 5s
      timeout: 3s
      retries: 10
